<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hotel Restaurant</title>

    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
    position: relative;
    overflow-x: hidden;
}

/* Floating Images */
.floating-img{
    position: absolute;
    width: 400px;
    opacity: 1;
    z-index: 10;
    animation: float 6s infinite ease-in-out;
}

.img1{
    top: 50%;
    left: 50%;
    transform: translate(-195%, -180%); 
}

.img2{
    bottom: 40%;
    right: 50%;
    transform: translate(195%, 180%);
}

@keyframes float {
    0%{ transform: translateY(0px); }
    50%{ transform: translateY(-15px); }
    100%{ transform: translateY(0px); }
}

/* Login Form */
form{
    text-align: center;
    border: 1px solid #555;
    padding: 40px;
    border-radius: 20px;
    background: rgba(26, 26, 26, 0.9);
    width: 340px;
    backdrop-filter: blur(6px);
    position: relative;
    z-index: 20;
    margin: 20px;
}

h2{
    color: #ff9f0d;
    margin-bottom: 20px;
    cursor:pointer;
}

.input-box{
    border: 1px solid #999;
    height: 44px;
    border-radius: 30px;
    margin-bottom: 15px;
    padding: 10px 15px;
    display: flex;
    align-items: center;
}

.input-box i{
    margin-right: 8px;
    color: #ff9f0d;
    font-size: 18px;
}

input{
    border: none;
    background: none;
    outline: none;
    color: #fff;
    width: 100%;
    font-size: 14px;
}

.links{
    display: flex;
    justify-content: space-between;
    margin: 15px 0;
}

a{
    font-size: 12px;
    color: #ff9f0d;
    text-decoration: none;
}

a:hover{
    text-decoration: underline;
}

button{
    width: 100%;
    height: 44px;
    background: #464545;
    border: none;
    border-radius: 30px;
    color: #ff9f0d;
    font-weight: 600;
    cursor: pointer;
    font-size: 17px;
    margin-top: 10px;
    transition: all .40s ease;
}

button:hover{
    background-color: #ff9f0d;
    box-shadow: 0px 0px 25px #ff9f0d;
    color: #fff;
    transform: scale(1.05);
}

.msg-status {
    font-size: 13px;
    margin-top: 12px;
}
.msg-status.error { color: #e74c3c; }
.msg-status.success { color: #2ecc71; }

/* Responsive Breakpoints */
@media (max-width: 480px) {
    .floating-img {
        display: none;
    }
    form {
        width: 92%;
        max-width: 340px;
        padding: 28px 18px;
        margin: 15px auto;
    }
}

/* ============ 350px BREAKPOINT (Compact Mobile Phones) ============ */
@media (max-width: 350px) {
    body {
        padding: 10px;
    }
    .floating-img {
        display: none;
    }
    form {
        width: 100%;
        max-width: 310px;
        padding: 22px 14px;
        margin: 10px auto;
        border-radius: 14px;
    }
    h2 {
        font-size: 1.45rem;
        margin-bottom: 14px;
    }
    .input-box {
        height: 42px;
        padding: 8px 12px;
        margin-bottom: 12px;
    }
    .input-box input {
        font-size: 13px;
    }
    .input-box i {
        font-size: 18px;
    }
    .btn {
        height: 42px;
        font-size: 14px;
        border-radius: 10px;
    }
    .forgot-link a,
    .register-link p,
    .register-link a {
        font-size: 12px;
    }
}

/* ============ 300px BREAKPOINT (Ultra-compact mobile / small phones) ============ */
@media (max-width: 300px) {
    body {
        padding: 8px;
    }
    .floating-img {
        display: none;
    }
    form {
        width: 100%;
        max-width: 275px;
        padding: 18px 12px;
        margin: 10px auto;
        border-radius: 12px;
    }
    h2 {
        font-size: 1.25rem;
        margin-bottom: 12px;
    }
    .input-box {
        height: 38px;
        padding: 6px 10px;
        margin-bottom: 10px;
        border-radius: 20px;
    }
    .input-box i {
        font-size: 15px;
        margin-right: 6px;
    }
    input {
        font-size: 12px;
    }
    .links {
        flex-direction: column;
        gap: 6px;
        align-items: center;
        margin: 10px 0;
    }
    a {
        font-size: 11px;
    }
    button {
        height: 38px;
        font-size: 14px;
        border-radius: 20px;
        margin-top: 6px;
    }
    .msg-status {
        font-size: 11px;
        margin-top: 8px;
    }
}
</style>
</head>

<body>

    <!-- Floating Images -->
    <img src="images/sekh_kabak-removebg-preview.png" class="floating-img img1" alt="">
    <img src="images/pizza-removebg-preview.png" class="floating-img img2" alt="">

    <form id="login-form">
        <h2>LOGIN</h2>

        <div class="input-box">
            <i class='bx bx-envelope'></i>
            <input type="text" id="login-identifier" placeholder="Enter Email or Phone" required>
        </div>

        <div class="input-box">
            <i class='bx bx-lock-alt'></i>
            <input type="password" id="login-password" placeholder="Enter Password" required>
        </div>

        <div class="links">
            <a href="new password.html">Forgot Password?</a>
            <a href="sign up.html" id="signup-link">Sign Up</a>
        </div>

        <button type="submit" id="btn-login">Login</button>
        <p id="msg-status" class="msg-status"></p>
    </form>

    <script src="items-store.js"></script>
    <script>
    // Check if redirect param is present
    const urlParams = new URLSearchParams(window.location.search);
    const redirectParam = urlParams.get('redirect');
    const signupLink = document.getElementById("signup-link");
    if (signupLink && redirectParam) {
        signupLink.href = `sign up.html?redirect=${encodeURIComponent(redirectParam)}`;
    }

    // If already logged in, redirect away from login page
    if (window.HotalStore && window.HotalStore.isLoggedIn()) {
        const isAdminUser = window.HotalStore.isAdmin();
        if (isAdminUser) {
            window.location.replace('admin.html');
        } else if (redirectParam && redirectParam !== 'admin.html') {
            window.location.replace(redirectParam);
        } else {
            window.location.replace('user-dashboard.html');
        }
    }

    function getRedirectDestination(user) {
        const isAdminUser = Boolean(user && user.role === 'admin');

        if (isAdminUser) {
            return 'admin.html';
        }

        // For non-admin users: Never allow opening admin.html
        if (redirectParam && redirectParam !== 'admin.html') {
            return redirectParam;
        }
        return 'user-dashboard.html';
    }

    document.getElementById("login-form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const identifier = document.getElementById("login-identifier").value.trim();
        const password = document.getElementById("login-password").value;
        const msgEl = document.getElementById("msg-status");
        const btn = document.getElementById("btn-login");

        btn.disabled = true;
        msgEl.className = "msg-status";
        msgEl.innerText = "Authenticating...";

        let networkFailed = false;

        try {
            let res = null;
            let data = null;

            try {
                // Attempt server API login
                res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identifier, password: password })
                });

                const contentType = res.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    data = await res.json();
                }
            } catch (networkErr) {
                console.warn('API network error:', networkErr);
            }

            // 1. If server responded with JSON success
            if (res && res.ok && data && data.success) {
                const sessionUser = {
                    ...data.user,
                    token: data.token
                };
                window.HotalStore.setCurrentUser(sessionUser);

                msgEl.className = "msg-status success";
                msgEl.innerText = "Login successful! Welcome back...";

                const destination = getRedirectDestination(sessionUser);
                setTimeout(() => {
                    window.location.href = destination;
                }, 800);
                return;
            }

            // 2. If server is active and explicitly rejected credentials
            if (res && (res.status === 401 || res.status === 400 || res.status === 429)) {
                msgEl.className = "msg-status error";
                msgEl.innerText = (data && data.message) || 'Invalid email/phone or password';
                btn.disabled = false;
                return;
            }

            // 3. If server endpoint is not configured (e.g. 404/405 on static hosting) or network failure:
            // Fall back to local authentication store
            const user = window.HotalStore.loginUser(identifier, password);
            msgEl.className = "msg-status success";
            msgEl.innerText = `Welcome back, ${user.full_name ? user.full_name.split(' ')[0] : 'User'}!`;

            const destination = getRedirectDestination(user);
            setTimeout(() => {
                window.location.href = destination;
            }, 800);

        } catch (localErr) {
            msgEl.className = "msg-status error";
            msgEl.innerText = localErr.message || "Invalid email/phone or password";
            btn.disabled = false;
        }
    });
    </script>

</body>
</html>
