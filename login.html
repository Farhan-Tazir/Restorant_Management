<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #111;
    position: relative;
    overflow: hidden;
}

/* Floating Images */
.floating-img{
    position: absolute;
    width: 400px;           /* BIGGER SIZE */
    opacity: 1;             /* Full color, no fade */
    z-index: 10;            /* ABOVE blur so no blue effect */
    animation: float 6s infinite ease-in-out;
}

/* Position close to form corners */
.img1{
    top: 50%;
    left: 50%;
    transform: translate(-195%, -180%); 
}

.img2{
    bottom: 40%;
    right: 50%;
    transform: translate(195%, 180%);
}

@keyframes float {
    0%{ transform: translateY(0px); }
    50%{ transform: translateY(-15px); }
    100%{ transform: translateY(0px); }
}

/* Login Form */
form{
    text-align: center;
    border: 1px solid #555;
    padding: 40px;
    border-radius: 20px;
    background: rgba(26, 26, 26, 0.9);
    width: 300px;
    backdrop-filter: blur(6px);
    position: relative;
    z-index: 20;  /* form is ABOVE images */
}

h2{
    color: #ff9f0d;
    margin-bottom: 20px;
    cursor:pointer;
}

.input-box{
    border: 1px solid #999;
    height: 40px;
    border-radius: 30px;
    margin-bottom: 15px;
    padding: 10px;
    display: flex;
    align-items: center;
}

.input-box i{
    margin-right: 8px;
    color: #ff9f0d;
}

input{
    border: none;
    background: none;
    outline: none;
    color: #fff;
    width: 80%;
}

a{
    font-size: 12px;
    color: #ff9f0d;
    margin: 0 10px;
}

button{
    width: 100%;
    height: 40px;
    background: #464545;
    border: none;
    border-radius: 30px;
    color: #ff9f0d;
    font-weight: 600;
    cursor: pointer;
    font-size: 17px;
    margin-top: 15px;
    transition: all .50s ease;
}
button:hover{
    background-color: #ff9f0d;
    box-shadow: 0px 0px 25px #ff9f0d;
    color: #fff;
    transform: scale(1.1);
}
</style>
</head>

<body>

    <!-- Floating Images -->
    <img src="images/sekh_kabak-removebg-preview.png" class="floating-img img1">
    <img src="images/pizza-removebg-preview.png" class="floating-img img2">

    <form action="index.html">
        <h2>LOGIN</h2>

        <div class="input-box">
            <i class='bx bxl-gmail'></i>
            <input type="email" placeholder="Enter Email" required>
        </div>

        <div class="input-box">
            <i class='bx bx-lock-alt'></i>
            <input type="password" placeholder="Enter Password" required>
        </div>

        <div class="links">
            <a href="new password.html">Forget Password?</a>
            <a href="sign up.html">Sign Up</a>
        </div>

        <button>Login</button>
    </form>

</body>
</html>
