<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Hotel Restaurant</title>

    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}
:root{
    --main-color:#ff9f0d;
    --bg-color:#111;
    --text-color:#fff;
    --border-color:#777;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
    overflow-x: hidden;
    position: relative;
}

/* Floating Images */
.floating-img{
    position: absolute;
    width: 380px;
    z-index: 10;
    animation: float 6s infinite ease-in-out;
}

.img1{
    top: 50%;
    left: 50%;
    transform: translate(-195%, -180%); 
}

.img2{
    bottom: 40%;
    right: 50%;
    transform: translate(195%, 180%);
}

@keyframes float {
    0%{ transform: translateY(0px); }
    50%{ transform: translateY(-15px); }
    100%{ transform: translateY(0px); }
}

/* FORM */
form{
    width: 420px;
    background: rgba(20, 20, 20, 0.85);
    border: 1px solid #666;
    padding: 35px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
    z-index: 20;
    margin: 20px;
}

h2{
    color: var(--main-color);
    margin-bottom: 20px;
    cursor: pointer;
    text-align: center;
}

/* INPUT BOXES */
.input-box{
    border: 1px solid var(--border-color);
    height: 45px;
    border-radius: 30px;
    margin-bottom: 15px;
    padding: 0px 15px;
    display: flex;
    align-items: center;
}

.input-box i{
    color: var(--main-color);
    margin-right: 10px;
}

input{
    width: 100%;
    border: none;
    outline: none;
    background: none;
    color: var(--text-color);
    font-size: 14px;
}

/* LINKS */
.links{
    text-align: center;
    margin: 10px 0;
}

.links a{
    color: var(--main-color);
    font-size: 13px;
    text-decoration: none;
}

.links a:hover{
    text-decoration: underline;
}

/* BUTTON */
button{
    width: 100%;
    height: 45px;
    background: #333;
    border: none;
    border-radius: 30px;
    color: var(--main-color);
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
    transition: .3s ease;
}

button:hover{
    background: var(--main-color);
    color: var(--text-color);
    box-shadow: 0px 0px 20px var(--main-color);
    transform: scale(1.03);
}

.msg-status {
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
}
.msg-status.success { color: #2ecc71; }
.msg-status.error { color: #e74c3c; }
</style>
</head>

<body>

    <!-- Floating Images -->
    <img src="images/sekh_kabak-removebg-preview.png" class="floating-img img1" alt="">
    <img src="images/pizza-removebg-preview.png" class="floating-img img2" alt="">

    <form id="signup-form">
        <h2>Create Account</h2>

        <div class="input-box">
            <i class='bx bx-user'></i>
            <input type="text" id="reg-name" placeholder="Enter Full Name" required>
        </div>

        <div class="input-box">
            <i class='bx bxl-gmail'></i>
            <input type="email" id="reg-email" placeholder="Enter Email" required>
        </div>

        <div class="input-box">
            <i class='bx bx-phone'></i>
            <input type="tel" id="reg-phone" placeholder="Enter Phone Number (e.g. +92...)" required>
        </div>

        <div class="input-box">
            <i class='bx bx-lock-alt'></i>
            <input type="password" id="newPass" placeholder="Enter Password" required>
        </div>

        <div class="input-box">
            <i class='bx bx-lock-alt'></i>
            <input type="password" id="confirmPass" placeholder="Confirm Password" required>
        </div>

        <div class="links">
            <a href="login.html" id="login-link">Already have an account? Login Instead</a>
        </div>

        <button type="submit" id="btn-submit">Create Account</button>
        <p id="msg-status" class="msg-status"></p>
    </form>

    <script src="items-store.js"></script>
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectParam = urlParams.get('redirect');
    const loginLink = document.getElementById("login-link");
    if (loginLink && redirectParam) {
        loginLink.href = `login.html?redirect=${encodeURIComponent(redirectParam)}`;
    }

    // If already logged in, redirect away
    if (window.HotalStore && window.HotalStore.isLoggedIn()) {
        window.location.replace(redirectParam || 'user-dashboard.html');
    }

    document.getElementById("signup-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const phone = document.getElementById("reg-phone").value.trim();
        const pass1 = document.getElementById("newPass").value;
        const pass2 = document.getElementById("confirmPass").value;
        const msgEl = document.getElementById("msg-status");
        const btn = document.getElementById("btn-submit");

        if (pass1 !== pass2) {
            msgEl.className = "msg-status error";
            msgEl.innerText = "Passwords do not match!";
            return;
        }

        if (pass1.length < 6) {
            msgEl.className = "msg-status error";
            msgEl.innerText = "Password must be at least 6 characters long.";
            return;
        }

        btn.disabled = true;
        msgEl.className = "msg-status";
        msgEl.innerText = "Creating account...";

        const destination = redirectParam || "user-dashboard.html";

        try {
            // Attempt API call
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name: name, email, phone, password: pass1 })
            });

            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Registration failed');
            }

            // Sync with local HotalStore
            window.HotalStore.registerUser({ full_name: name, email, phone, password: pass1 });
            window.HotalStore.loginUser(email, pass1);

            msgEl.className = "msg-status success";
            msgEl.innerText = "Account created successfully! Redirecting...";

            setTimeout(() => {
                window.location.href = destination;
            }, 800);

        } catch (err) {
            // Fallback to client HotalStore
            try {
                const user = window.HotalStore.registerUser({ full_name: name, email, phone, password: pass1 });
                window.HotalStore.setCurrentUser(user);

                msgEl.className = "msg-status success";
                msgEl.innerText = "Account created! Redirecting...";

                setTimeout(() => {
                    window.location.href = destination;
                }, 800);
            } catch (localErr) {
                msgEl.className = "msg-status error";
                msgEl.innerText = localErr.message || err.message || "Failed to create account.";
                btn.disabled = false;
            }
        }
    });
    </script>
</body>
</html>
