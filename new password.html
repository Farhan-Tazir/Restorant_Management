<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Hotel Restaurant</title>

    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
    position: relative;
    overflow-x: hidden;
}

/* Floating Images */
.floating-img{
    position: absolute;
    width: 400px;
    opacity: 1;
    z-index: 10;
    animation: float 6s infinite ease-in-out;
}

.img1{
    top: 50%;
    left: 50%;
    transform: translate(-195%, -180%); 
}

.img2{
    bottom: 40%;
    right: 50%;
    transform: translate(195%, 180%);
}

@keyframes float {
    0%{ transform: translateY(0px); }
    50%{ transform: translateY(-15px); }
    100%{ transform: translateY(0px); }
}

/* Form */
form{
    text-align: center;
    border: 1px solid #555;
    padding: 35px 30px;
    border-radius: 20px;
    background: rgba(26, 26, 26, 0.92);
    width: 360px;
    backdrop-filter: blur(6px);
    position: relative;
    z-index: 20;
    margin: 20px;
}

h2{
    color: #ff9f0d;
    margin-bottom: 8px;
    font-size: 1.6rem;
}

.sub-title {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 20px;
}

.input-box{
    border: 1px solid #777;
    height: 44px;
    border-radius: 30px;
    margin-bottom: 14px;
    padding: 10px 15px;
    display: flex;
    align-items: center;
}

.input-box i{
    margin-right: 10px;
    color: #ff9f0d;
    font-size: 18px;
}

input{
    border: none;
    background: none;
    outline: none;
    color: #fff;
    width: 100%;
    font-size: 14px;
}

.step-box {
    margin-bottom: 10px;
}

.step-box[hidden] {
    display: none;
}

.links{
    display: flex;
    justify-content: space-between;
    margin: 15px 0;
}

a{
    font-size: 12px;
    color: #ff9f0d;
    text-decoration: none;
}

a:hover{
    text-decoration: underline;
}

button{
    width: 100%;
    height: 44px;
    background: #333;
    border: none;
    border-radius: 30px;
    color: #ff9f0d;
    font-weight: 700;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
    transition: all .30s ease;
}

button:hover{
    background-color: #ff9f0d;
    box-shadow: 0px 0px 20px #ff9f0d;
    color: #fff;
    transform: scale(1.03);
}

.msg-status {
    font-size: 13px;
    margin-top: 12px;
}
.msg-status.error { color: #e74c3c; }
.msg-status.success { color: #2ecc71; }

/* Responsive Breakpoints */
@media (max-width: 480px) {
    .floating-img {
        display: none;
    }
    form {
        width: 92%;
        max-width: 360px;
        padding: 26px 18px;
        margin: 15px auto;
    }
}

/* ============ 350px BREAKPOINT (Compact Mobile Phones) ============ */
@media (max-width: 350px) {
    body {
        padding: 10px;
    }
    .floating-img {
        display: none;
    }
    form {
        width: 100%;
        max-width: 310px;
        padding: 20px 14px;
        margin: 8px auto;
        border-radius: 14px;
    }
    h2 {
        font-size: 1.35rem;
        margin-bottom: 6px;
    }
    .sub-title {
        font-size: 11px;
        margin-bottom: 14px;
    }
    .input-box {
        height: 42px;
        padding: 8px 12px;
        margin-bottom: 10px;
    }
    .input-box input {
        font-size: 13px;
    }
    .input-box i {
        font-size: 18px;
    }
    .btn {
        height: 42px;
        font-size: 14px;
        border-radius: 10px;
    }
    .register-link p,
    .register-link a {
        font-size: 12px;
    }
}

/* ============ 300px BREAKPOINT (Ultra-compact mobile / small phones) ============ */
@media (max-width: 300px) {
    body {
        padding: 8px;
    }
    .floating-img {
        display: none;
    }
    form {
        width: 100%;
        max-width: 275px;
        padding: 16px 12px;
        margin: 8px auto;
        border-radius: 12px;
    }
    h2 {
        font-size: 1.25rem;
        margin-bottom: 6px;
    }
    .sub-title {
        font-size: 11px;
        margin-bottom: 14px;
    }
    .input-box {
        height: 38px;
        padding: 6px 10px;
        margin-bottom: 10px;
        border-radius: 20px;
    }
    .input-box i {
        font-size: 15px;
        margin-right: 6px;
    }
    input {
        font-size: 12px;
    }
    .links a {
        font-size: 11px;
    }
    button {
        height: 38px;
        font-size: 14px;
        border-radius: 20px;
        margin-top: 6px;
    }
    .msg-status {
        font-size: 11px;
        margin-top: 8px;
    }
}
</style>
</head>

<body>

    <!-- Floating Images -->
    <img src="images/burger-removebg-preview.png" class="floating-img img1" alt="">
    <img src="images/sekh_kabak-removebg-preview.png" class="floating-img img2" alt="">

    <form id="reset-password-form">
        <h2>Reset Password</h2>
        <p class="sub-title">Verify your phone number to update password</p>

        <!-- STEP 1: Phone Verification -->
        <div id="step-1" class="step-box">
            <div class="input-box">
                <i class='bx bx-phone'></i>
                <input type="tel" id="verify-phone" placeholder="Enter Registered Phone" required>
            </div>
            <button type="button" id="btn-verify-phone">Verify Phone Number</button>
        </div>

        <!-- STEP 2: Enter New Password (Shown after phone verified) -->
        <div id="step-2" class="step-box" hidden>
            <div class="input-box">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="newPass" placeholder="Enter New Password">
            </div>

            <div class="input-box">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="confirmPass" placeholder="Confirm New Password">
            </div>
            <button type="submit" id="btn-reset">Update Password</button>
        </div>

        <div class="links">
            <a href="sign up.html">Create Account?</a>
            <a href="login.html">Back to Login</a>
        </div>

        <p id="msg-status" class="msg-status"></p>
    </form>

    <script src="items-store.js"></script>
    <script>
    let isPhoneVerified = false;
    let verifiedPhoneNum = "";
    let verifiedResetToken = "";

    const btnVerifyPhone = document.getElementById("btn-verify-phone");
    const step1 = document.getElementById("step-1");
    const step2 = document.getElementById("step-2");
    const msgEl = document.getElementById("msg-status");

    btnVerifyPhone.addEventListener("click", async () => {
        const phone = document.getElementById("verify-phone").value.trim();
        if (!phone) {
            msgEl.className = "msg-status error";
            msgEl.innerText = "Please enter your registered phone number.";
            return;
        }

        msgEl.className = "msg-status";
        msgEl.innerText = "Verifying phone number...";

        try {
            // Check API
            const res = await fetch('/api/auth/verify-phone', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });

            const data = await res.json();
            if (!res.ok || !data.success) {
                throw new Error(data.message || 'Phone number not found');
            }

            isPhoneVerified = true;
            verifiedPhoneNum = phone;
            verifiedResetToken = data.reset_token || "";
            step2.hidden = false;
            btnVerifyPhone.disabled = true;
            document.getElementById("verify-phone").readOnly = true;

            msgEl.className = "msg-status success";
            msgEl.innerText = `Phone verified! (${data.user_name || 'Account found'}). Please set a new password below.`;

        } catch (err) {
            // Local fallback
            try {
                const localUser = window.HotalStore.verifyPhone(phone);
                if (localUser) {
                    isPhoneVerified = true;
                    verifiedPhoneNum = phone;
                    step2.hidden = false;
                    btnVerifyPhone.disabled = true;
                    document.getElementById("verify-phone").readOnly = true;

                    msgEl.className = "msg-status success";
                    msgEl.innerText = `Phone verified! (${localUser.full_name}). Please set a new password below.`;
                } else {
                    msgEl.className = "msg-status error";
                    msgEl.innerText = err.message || "No registered account found with this phone number.";
                }
            } catch (localErr) {
                msgEl.className = "msg-status error";
                msgEl.innerText = localErr.message || err.message || "Verification failed.";
            }
        }
    });

    document.getElementById("reset-password-form").addEventListener("submit", async function(e) {
        e.preventDefault();

        if (!isPhoneVerified) {
            msgEl.className = "msg-status error";
            msgEl.innerText = "Please verify your phone number first!";
            return;
        }

        const pass1 = document.getElementById("newPass").value;
        const pass2 = document.getElementById("confirmPass").value;

        if (pass1 !== pass2) {
            msgEl.className = "msg-status error";
            msgEl.innerText = "Passwords do not match!";
            return;
        }

        if (pass1.length < 6) {
            msgEl.className = "msg-status error";
            msgEl.innerText = "Password must be at least 6 characters long.";
            return;
        }

        msgEl.className = "msg-status";
        msgEl.innerText = "Updating password...";

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: verifiedPhoneNum,
                    new_password: pass1,
                    reset_token: verifiedResetToken
                })
            });

            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.message);

            // Sync with local HotalStore
            window.HotalStore.resetPasswordByPhone(verifiedPhoneNum, pass1);

            msgEl.className = "msg-status success";
            msgEl.innerText = "Password updated successfully! Redirecting to login...";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);

        } catch (err) {
            try {
                window.HotalStore.resetPasswordByPhone(verifiedPhoneNum, pass1);
                msgEl.className = "msg-status success";
                msgEl.innerText = "Password updated successfully! Redirecting to login...";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);
            } catch (localErr) {
                msgEl.className = "msg-status error";
                msgEl.innerText = localErr.message || err.message || "Failed to update password.";
            }
        }
    });
    </script>
</body>
</html>
